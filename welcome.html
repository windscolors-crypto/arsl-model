<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#bcd4e6">
<title>صوت الصدفة — أهلاً</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;
       display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
       padding:0 22px 30px;text-align:center;position:relative;color:#274b63;
       background:#cfe0ec url('bg_scale.png') center top/cover no-repeat;
       background-attachment:fixed}
  .logo{margin-top:34px;width:100%;max-width:300px;
        filter:drop-shadow(0 6px 16px rgba(20,40,70,.22))}
  .ar{margin-top:6px;font-size:1.5rem;font-weight:800;color:#274b63;
      text-shadow:0 2px 6px rgba(255,255,255,.6)}
  .enter{margin-top:40px;font-size:1.3rem;font-weight:700;color:#2f5670;
         text-shadow:0 1px 4px rgba(255,255,255,.6)}
  input{margin-top:14px;width:100%;max-width:330px;padding:15px 18px;border-radius:14px;
        border:2px solid #cdb86a;font-size:1.05rem;background:rgba(255,255,255,.95);
        color:#234;text-align:center;box-shadow:0 3px 10px rgba(20,40,70,.12)}
  input::placeholder{color:#9ab}
  .start{margin-top:40px;width:100%;max-width:300px;padding:18px;border:none;border-radius:16px;
         font:800 1.4rem/1 Georgia,serif;color:#3a3014;cursor:pointer;letter-spacing:.5px;
         background:linear-gradient(180deg,#f3ead0,#e2cf94);
         box-shadow:0 6px 16px rgba(20,40,70,.22);text-shadow:0 1px 2px rgba(255,255,255,.5)}
  .start:active{transform:scale(.97)}
</style>
</head>
<body>
  <img class="logo" src="logo_card.png" alt="Shell Voice">
  <div class="ar">صوت الصدفة</div>

  <div class="enter">enter your name</div>
  <input id="nm" type="text" placeholder="Type here" autocomplete="off">

  <button class="start" onclick="go()">get started</button>

  <script>
    function go(){
      var n=document.getElementById('nm').value.trim();
      try{ if(n) localStorage.setItem('sv_name', n); }catch(e){}
      location.href='choices.html';
    }
    document.getElementById('nm').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
  </script>
</body>
</html>
