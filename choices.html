<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#bcd4e6">
<title>صوت الصدفة — الخدمات</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;color:#fff;
       display:flex;flex-direction:column;align-items:center;padding:0 22px 28px;text-align:center}
  .bg{position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 50% 100%, transparent 23%, #9dc0db 24% 33%, transparent 34%) 0 0/72px 36px,
      radial-gradient(circle at 50% 100%, transparent 23%, #b3d0e6 24% 33%, transparent 34%) 36px 18px/72px 36px,
      linear-gradient(180deg,#dbeaf4,#c3dbec);}
  .frame{margin-top:40px;background:rgba(255,252,235,.28);border:5px solid #d9c463;border-radius:14px;
         padding:12px 22px;box-shadow:0 5px 14px rgba(20,40,70,.2)}
  .frame .s{font:italic 800 1.7rem/1 Georgia,serif;text-shadow:0 2px 6px rgba(20,40,70,.3)}
  .greet{margin:20px 0 4px;font-size:1.15rem;font-weight:800;text-shadow:0 2px 6px rgba(20,40,70,.3)}
  .sub{font-size:1rem;font-weight:700;color:#eef6fc;margin-bottom:16px;
       font-family:Georgia,serif;font-style:italic}
  .menu{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
  a.btn{display:flex;align-items:center;gap:14px;justify-content:center;text-decoration:none;color:#fff;
        padding:18px 16px;border-radius:18px;font:800 1.3rem/1.15 Georgia,serif;
        background:linear-gradient(180deg,#e8d985,#d9c463);
        box-shadow:0 5px 14px rgba(20,40,70,.22);text-shadow:0 1px 3px rgba(20,40,70,.3)}
  a.btn:active{transform:scale(.97)}
  a.btn .ic{font-size:1.9rem}
  a.btn small{display:block;font:600 .8rem/1.2 -apple-system,sans-serif;color:#fffef5;margin-top:3px;text-shadow:none}
  a.translate{background:linear-gradient(180deg,#f0b9c0,#e2949d)}
  a.learn{background:linear-gradient(180deg,#a9dcc0,#82c8a2)}
  .foot{margin-top:auto;padding-top:22px;color:#eef6fc;font-size:.8rem}
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="frame"><div class="s">SHELL VOICE</div></div>
  <div class="greet" id="greet">choose the theme to talk with</div>
  <div class="sub">صوت الصدفة</div>

  <nav class="menu">
    <a class="btn translate" href="avatar_vrm.html"><span class="ic">📝</span><span>ترجمة<small>اكتب جملة → الأفيتار يأشّرها</small></span></a>
    <a class="btn learn" href="learn.html"><span class="ic">📚</span><span>تعلّم مع الصدفة<small>تعلّم الكلمة بلغة الإشارة</small></span></a>
    <a class="btn" href="letters.html"><span class="ic">🔤</span><span>تعرّف الحروف<small>بالكاميرا</small></span></a>
    <a class="btn" href="words.html"><span class="ic">✋</span><span>تعرّف الكلمات<small>بالكاميرا</small></span></a>
  </nav>

  <div class="foot">معرض علماء الغد 2026 · T566</div>

  <script>
    try{var n=localStorage.getItem('sv_name'); if(n) document.getElementById('greet').textContent='أهلاً '+n+' 👋';}catch(e){}
  </script>
</body>
</html>
